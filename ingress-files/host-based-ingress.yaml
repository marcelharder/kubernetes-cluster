apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: cheddar
spec:
 rules:
 - host: cheddar.fotoboek-harder.nl
   http:
     paths:
     - path: /
       pathType: Prefix
       backend:
         service:
           name: cheddar
           port:
             number: 80
---
