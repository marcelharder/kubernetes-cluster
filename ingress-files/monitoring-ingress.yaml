apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: nginx
    # If using cert-manager for HTTPS, uncomment the line below:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
  - host: grafana.local  # Replace with your domain or IP-based host
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kube-prom-stack-grafana
            port:
              number: 80
  - host: prometheus.local # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-kube-prom-stack-kube-prome-prometheus
            port:
              number: 9090
