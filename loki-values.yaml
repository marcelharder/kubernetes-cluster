deploymentMode: SingleBinary

loki:
  useTestSchema: true

  config: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      path_prefix: /var/loki
      replication_factor: 1
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules

    schema_config:
      configs:
        - from: "2020-10-24"
          store: boltdb-shipper
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /var/loki

    limits_config:
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      max_cache_freshness_per_query: 10m

    query_range:
      align_queries_with_step: true

singleBinary:
  replicas: 1

persistence:
  enabled: true
  storageClassName: nfs-csi
  size: 20Gi

backend:
  enabled: false
  replicas: 0

read:
  enabled: false
  replicas: 0

write:
  enabled: false
  replicas: 0

gateway:
  enabled: false
  replicas: 0

promtail:
  enabled: true

  config:
    snippets:
      pipelineStages:
        - regex:
            expression: '^(?P<client_ip>\d+\.\d+\.\d+\.\d+)'
        - http:
            url: http://geoip-api.monitoring.svc.cluster.local:8080/lookup?ip=${client_ip}
            method: GET
            timeout: 500ms
            output:
              geo_country: country
              geo_city: city
              geo_asn: asn
              geo_lat: latitude
              geo_lon: longitude
        - labels:
            client_ip:
            geo_country:
            geo_city:
            geo_asn:
            geo_lat:
            geo_lon:

