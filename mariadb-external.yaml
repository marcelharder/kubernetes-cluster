
apiVersion: v1
kind: Service
metadata:
  name: mariadb-external
  namespace: mariadb       # <--- THIS MUST MATCH THE STATEFULSET
  labels:
    app: db
spec:
  type: NodePort
  selector:
    app: db                # <--- Matches the template.metadata.labels in your STS
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      nodePort: 31543     # Manual port (optional)