apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: "/usr/share/nginx/html"
          name: nfs-storage
      volumes:
        - name: nfs-storage
          persistentVolumeClaim:
            claimName: my-pvc
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  # annotations:
    # metallb.universe.tf/addresspool: custom-addresspool
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

