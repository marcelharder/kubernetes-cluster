apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        runAsUser: 777
      volumes:
       - name: mariadb-nfs-storage
         persistentVolumeClaim: 
           claimName: maria-pvc
      containers:
      - name: db
        image: mariadb:latest
        env:
          - name: MYSQL_ROOT_USERNAME
            valueFrom:
              secretKeyRef:
                 name: mariadb-secret
                 key: mariadb-root-username
          - name: MYSQL_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                 name: mariadb-secret
                 key: mariadb-root-password
        ports:
          - containerPort: 3306
        volumeMounts:
          - mountPath: /var/lib/mysql
            name: mariadb-nfs-storage

---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  type: LoadBalancer

